<VirtualHost *:80>
    ServerName ecotrack-san-manuel.duckdns.org
    DocumentRoot /var/www/ecotrack
    Timeout 600

    SetEnv APP_ENV "production"
    SetEnv PASSWORD_RESET_ENABLED "false"
    IncludeOptional /etc/apache2/ecotrack-secrets.conf

    <Directory /var/www/ecotrack>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/ecotrack/uploads>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted

        <FilesMatch "\.(?:php[0-9s]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ecotrack-error.log
    CustomLog ${APACHE_LOG_DIR}/ecotrack-access.log combined
</VirtualHost>
